name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testy
        run: npm test

# Uwaga: `next build` nie jest tu uruchamiany, bo wymaga sekretów
# (Supabase, Stripe, Sentry). Build weryfikuje Vercel przy deployu.
# Ten workflow ma łapać to, co da się sprawdzić bez dostępu do produkcji.
